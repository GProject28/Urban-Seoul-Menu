<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>Urban Seoul Restaurant | Our Menu</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Gowun+Dodum&display=swap" rel="stylesheet">

<style>
:root {
    --orange: #ff8c00;
    --gold: #ffb347;
    --dark: #111;
    --panel: #1b1b1b;
    --white: #fff;
    --muted: #999;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
    margin: 0;
    min-height: 100vh;
    overflow-x: hidden;
    color: var(--white);
    font-family: 'Gowun Dodum', Arial, sans-serif;
    background: radial-gradient(ellipse at top, #37302a 0%, #171717 45%, #0c0c0c 100%);
}

body.viewer-open { overflow: hidden; }

button { font: inherit; }

/* HEADER */
.hero {
    position: relative;
    overflow: hidden;
    padding: 42px 20px 35px;
    text-align: center;
    border-bottom: 1px solid rgba(255,140,0,.3);
    background: linear-gradient(180deg, rgba(0,0,0,.8), rgba(20,20,20,.3));
}

.hero::before {
    content: "";
    position: absolute;
    top: -180px;
    left: 50%;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: rgba(255,140,0,.1);
    filter: blur(70px);
    transform: translateX(-50%);
    pointer-events: none;
}

.brand { position: relative; z-index: 1; }

.logo-wrap {
    display: grid;
    place-items: center;
    width: 112px;
    height: 112px;
    margin: 0 auto 18px;
    padding: 8px;
    overflow: hidden;
    border: 2px solid var(--orange);
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 30px rgba(255,140,0,.18);
}

.logo-wrap img {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: contain;
}

.eyebrow {
    margin-bottom: 10px;
    color: var(--gold);
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 5px;
}

h1 {
    margin: 0;
    color: #fff;
    font-family: 'Russo One', sans-serif;
    font-size: clamp(27px, 5vw, 48px);
    font-weight: normal;
    line-height: 1.2;
    letter-spacing: 1px;
    text-transform: uppercase;
    text-shadow: 0 3px 20px rgba(0,0,0,.5);
}

h1 span, .section-heading h2 span, .viewer-brand strong span { color: var(--orange); }

.subtitle {
    margin-top: 13px;
    color: #c8c8c8;
    font-size: 14px;
    letter-spacing: 1px;
}

.orange-line {
    width: 65px;
    height: 3px;
    margin: 22px auto 0;
    border-radius: 10px;
    background: linear-gradient(90deg, var(--orange), var(--gold));
}

/* MENU GALLERY */
.section {
    width: min(1200px, 100%);
    margin: 0 auto;
    padding: 36px 22px 55px;
}

.section-heading {
    display: flex;
    align-items: end;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 24px;
}

.section-heading h2 {
    margin: 0;
    font-family: 'Russo One', sans-serif;
    font-size: clamp(20px, 3vw, 28px);
    font-weight: normal;
}

.section-heading p {
    margin: 7px 0 0;
    color: var(--muted);
    font-size: 12px;
}

.menu-count {
    padding: 8px 12px;
    border: 1px solid rgba(255,140,0,.35);
    border-radius: 30px;
    background: rgba(255,140,0,.07);
    color: var(--gold);
    font-size: 12px;
    white-space: nowrap;
}

.menu-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 24px;
}

.menu-card {
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 14px;
    background: var(--panel);
    box-shadow: 0 8px 25px rgba(0,0,0,.25);
    cursor: pointer;
    animation: rise .6s both;
    transition: transform .3s ease, border-color .3s ease, box-shadow .3s ease;
}

.menu-card:hover {
    transform: translateY(-6px);
    border-color: var(--orange);
    box-shadow: 0 15px 35px rgba(255,140,0,.12);
}

.menu-card:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 4px;
}

.menu-image {
    position: relative;
    overflow: hidden;
    aspect-ratio: 3 / 4;
    background: #252525;
}

.menu-image img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    transition: transform .45s ease;
}

.menu-card:hover .menu-image img { transform: scale(1.035); }

.menu-number {
    position: absolute;
    z-index: 1;
    top: 12px;
    left: 12px;
    padding: 8px 12px;
    border-radius: 4px;
    background: var(--orange);
    color: #111;
    box-shadow: 0 3px 12px rgba(0,0,0,.25);
    font-family: 'Russo One', sans-serif;
    font-size: 11px;
    letter-spacing: 1px;
}

.view-hint {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.3);
    opacity: 0;
    transition: opacity .25s ease;
}

.view-hint span {
    padding: 11px 17px;
    border: 1px solid rgba(255,255,255,.7);
    border-radius: 30px;
    background: rgba(0,0,0,.65);
    color: #fff;
    font-size: 12px;
}

.menu-card:hover .view-hint,
.menu-card:focus-visible .view-hint { opacity: 1; }

.card-info {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 15px 16px;
}

.card-info h3 {
    margin: 0;
    color: #fff;
    font-family: 'Russo One', sans-serif;
    font-size: 15px;
    font-weight: normal;
}

.card-info p {
    margin: 5px 0 0;
    color: var(--muted);
    font-size: 11px;
}

.open-icon {
    display: flex;
    flex: 0 0 34px;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border: 1px solid rgba(255,140,0,.4);
    border-radius: 50%;
    color: var(--orange);
    font-size: 19px;
}

@keyframes rise {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
}

/* FULLSCREEN, DRAGGABLE PHOTO VIEWER */
.viewer {
    position: fixed;
    z-index: 9999;
    inset: 0;
    display: none;
    flex-direction: column;
    background: rgba(8,8,8,.98);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
}

.viewer.active {
    display: flex;
    animation: viewerFade .2s ease;
}

@keyframes viewerFade {
    from { opacity: 0; }
    to { opacity: 1; }
}

.viewer-top {
    display: flex;
    flex: 0 0 70px;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    padding: 0 22px;
    border-bottom: 1px solid rgba(255,255,255,.1);
}

.viewer-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.viewer-brand img {
    width: 35px;
    height: 35px;
    border-radius: 50%;
    background: #fff;
    object-fit: contain;
}

.viewer-brand strong {
    font-family: 'Russo One', sans-serif;
    font-size: 12px;
    font-weight: normal;
}

.viewer-counter {
    color: var(--gold);
    font-size: 13px;
    white-space: nowrap;
}

.close-btn {
    display: grid;
    flex: 0 0 40px;
    place-items: center;
    width: 40px;
    height: 40px;
    padding: 0;
    border: 1px solid #555;
    border-radius: 50%;
    background: #202020;
    color: #fff;
    cursor: pointer;
    font-size: 25px;
    line-height: 1;
    transition: background .2s;
}

.close-btn:hover { background: #a52b21; }

.viewer-stage {
    position: relative;
    display: block;
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
    padding: 0;
    touch-action: pan-y pinch-zoom;
    overscroll-behavior: contain;
}

.slide-track {
    display: flex;
    width: 300%;
    height: 100%;
    transform: translate3d(-33.333333%, 0, 0);
    will-change: transform;
}

.slide-panel {
    display: flex;
    flex: 0 0 33.333333%;
    align-items: center;
    justify-content: center;
    width: 33.333333%;
    height: 100%;
    min-width: 0;
    padding: 12px;
}

.slide-panel img {
    display: block;
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    border-radius: 3px;
    object-fit: contain;
    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-user-drag: none;
}

.viewer-bottom {
    flex: 0 0 auto;
    padding: 13px 15px 20px;
    border-top: 1px solid rgba(255,255,255,.08);
    text-align: center;
}

.viewer-title {
    margin-bottom: 12px;
    font-family: 'Russo One', sans-serif;
    font-size: 14px;
    font-weight: normal;
}

.viewer-title span { color: var(--orange); }

.dots {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

.dot {
    width: 8px;
    height: 8px;
    padding: 0;
    border: 0;
    border-radius: 10px;
    background: #555;
    cursor: pointer;
    transition: width .25s, background .25s;
}

.dot.active {
    width: 25px;
    background: var(--orange);
}

.footer {
    padding: 25px 15px;
    border-top: 1px solid rgba(255,255,255,.08);
    color: #777;
    font-size: 12px;
    letter-spacing: .5px;
    text-align: center;
}

.footer span { color: var(--orange); }

@media (max-width: 800px) {
    .menu-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 15px;
    }

    .section { padding: 28px 14px 40px; }
    .card-info { padding: 12px 10px; }
    .card-info h3 { font-size: 12px; }
    .card-info p { font-size: 10px; }
    .open-icon { flex-basis: 29px; width: 29px; height: 29px; }
    .viewer-top { flex-basis: 58px; padding: 0 12px; }
    .viewer-brand strong { font-size: 10px; }
    .viewer-brand img { width: 30px; height: 30px; }
    .slide-panel { padding: 8px; }
}

@media (max-width: 380px) {
    .eyebrow { letter-spacing: 3px; }
    .menu-grid { gap: 10px; }
    .menu-number { top: 8px; left: 8px; padding: 6px 8px; font-size: 9px; }
    .card-info h3 { font-size: 11px; }
    .viewer-brand { gap: 6px; }
    .viewer-brand strong { font-size: 9px; }
    .viewer-counter { font-size: 11px; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
    }
}
</style>
</head>

<body>

<header class="hero">
    <div class="brand">
        <div class="logo-wrap">
            <img src="logo.png" alt="Urban Seoul Restaurant Logo">
        </div>
        <div class="eyebrow">AUTHENTIC KOREAN FLAVORS</div>
        <h1>URBAN <span>SEOUL</span></h1>
        <div class="subtitle">Restaurant Menu Collection</div>
        <div class="orange-line"></div>
    </div>
</header>

<main class="section">
    <div class="section-heading">
        <div>
            <h2>OUR <span>MENU</span></h2>
            <p>Explore our menu collection. Tap to view.</p>
        </div>
        <div class="menu-count">6 MENUS</div>
    </div>
    <div class="menu-grid" id="menuGrid"></div>
</main>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Menu photo viewer">
    <div class="viewer-top">
        <div class="viewer-brand">
            <img src="logo.png" alt="">
            <strong>URBAN <span>SEOUL</span></strong>
        </div>
        <div class="viewer-counter" id="counter">1 / 6</div>
        <button class="close-btn" id="closeBtn" type="button" aria-label="Close viewer">&times;</button>
    </div>

    <div class="viewer-stage" id="viewerStage">
        <div class="slide-track" id="slideTrack">
            <div class="slide-panel">
                <img id="prevImage" src="" alt="Previous menu">
            </div>
            <div class="slide-panel">
                <img id="viewerImage" src="" alt="Restaurant menu">
            </div>
            <div class="slide-panel">
                <img id="nextImage" src="" alt="Next menu">
            </div>
        </div>
    </div>

    <div class="viewer-bottom">
        <div class="viewer-title" id="viewerTitle"><span>MENU 1</span></div>
        <div class="dots" id="dots"></div>
    </div>
</div>

<footer class="footer">
    &copy; 2026 <span>Urban Seoul Restaurant</span> &bull; All Rights Reserved
</footer>

<script>
(() => {
    'use strict';

    const menus = [
        { image: 'Menu1.png', title: 'Menu 1' },
        { image: 'Menu2.png', title: 'Menu 2' },
        { image: 'Menu4.png', title: 'Menu 3' },
        { image: 'Menu5.png', title: 'Menu 4' },
        { image: 'Menu6.png', title: 'Menu 5' }
    ];

    const grid = document.getElementById('menuGrid');
    const viewer = document.getElementById('viewer');
    const viewerImage = document.getElementById('viewerImage');
    const prevImage = document.getElementById('prevImage');
    const nextImage = document.getElementById('nextImage');
    const viewerTitle = document.getElementById('viewerTitle');
    const counter = document.getElementById('counter');
    const dotsContainer = document.getElementById('dots');
    const viewerStage = document.getElementById('viewerStage');
    const slideTrack = document.getElementById('slideTrack');
    const closeBtn = document.getElementById('closeBtn');

    let currentIndex = 0;
    let previousFocus = null;
    let startX = 0;
    let startY = 0;
    let dragX = 0;
    let dragging = false;
    let horizontalDrag = false;
    let isAnimating = false;
    let activePointerId = null;
    let animationTimer = null;

    const SWIPE_THRESHOLD = 0.18;
    const ANIMATION_DURATION = 280;

    function buildCards() {
        menus.forEach((menu, index) => {
            const card = document.createElement('article');
            card.className = 'menu-card';
            card.style.animationDelay = `${index * 0.08}s`;
            card.tabIndex = 0;
            card.setAttribute('role', 'button');
            card.setAttribute('aria-label', `Open ${menu.title}`);

            card.innerHTML = `
                <div class="menu-image">
                    <span class="menu-number">${menu.title.toUpperCase()}</span>
                    <img src="${menu.image}" alt="${menu.title}" loading="${index < 2 ? 'eager' : 'lazy'}">
                    <div class="view-hint"><span>View Full Menu ↗</span></div>
                </div>
                <div class="card-info">
                    <div><h3>${menu.title}</h3><p>Tap to explore</p></div>
                    <span class="open-icon" aria-hidden="true">↗</span>
                </div>
            `;

            card.addEventListener('click', () => openViewer(index));
            card.addEventListener('keydown', event => {
                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    openViewer(index);
                }
            });

            grid.appendChild(card);
        });
    }

    function buildDots() {
        menus.forEach((menu, index) => {
            const dot = document.createElement('button');
            dot.className = 'dot';
            dot.type = 'button';
            dot.setAttribute('aria-label', `Go to ${menu.title}`);
            dot.addEventListener('click', () => {
                if (!isAnimating) goToSlide(index);
            });
            dotsContainer.appendChild(dot);
        });
    }

    function updateInfo() {
        viewerTitle.innerHTML = `<span>${menus[currentIndex].title.toUpperCase()}</span>`;
        counter.textContent = `${currentIndex + 1} / ${menus.length}`;

        dotsContainer.querySelectorAll('.dot').forEach((dot, index) => {
            dot.classList.toggle('active', index === currentIndex);
            if (index === currentIndex) dot.setAttribute('aria-current', 'true');
            else dot.removeAttribute('aria-current');
        });
    }

    function prepareImages() {
        const previousIndex = (currentIndex - 1 + menus.length) % menus.length;
        const nextIndex = (currentIndex + 1) % menus.length;

        prevImage.src = menus[previousIndex].image;
        prevImage.alt = menus[previousIndex].title;

        viewerImage.src = menus[currentIndex].image;
        viewerImage.alt = menus[currentIndex].title;

        nextImage.src = menus[nextIndex].image;
        nextImage.alt = menus[nextIndex].title;
    }

    function setTrackPosition(offset, animate = false) {
        slideTrack.style.transition = animate
            ? `transform ${ANIMATION_DURATION}ms cubic-bezier(.22,.61,.36,1)`
            : 'none';
        // Three equal panels: keep the current menu centered at - one panel width.
        slideTrack.style.transform = `translate3d(calc(-33.333333% + ${offset}px), 0, 0)`;
    }

    function resetTrack(animate = true) {
        setTrackPosition(0, animate);
    }

    function openViewer(index) {
        if (isAnimating) return;

        previousFocus = document.activeElement;
        currentIndex = index;
        prepareImages();
        updateInfo();

        viewer.classList.add('active');
        document.body.classList.add('viewer-open');
        resetTrack(false);
        closeBtn.focus();
    }

    function finishSlide(direction) {
        if (isAnimating) return;
        isAnimating = true;

        const width = viewerStage.clientWidth;
        // Track contains previous, current and next panels.
        // Slide left to reveal next; slide right to reveal previous.
        setTrackPosition(direction === 1 ? -width : width, true);

        clearTimeout(animationTimer);
        animationTimer = setTimeout(() => {
            currentIndex = (currentIndex + direction + menus.length) % menus.length;
            prepareImages();
            updateInfo();
            resetTrack(false);
            isAnimating = false;
        }, ANIMATION_DURATION + 30);
    }

    function goToSlide(index) {
        if (isAnimating || index === currentIndex) return;

        const forwardDistance = (index - currentIndex + menus.length) % menus.length;
        const direction = forwardDistance <= menus.length / 2 ? 1 : -1;

        isAnimating = true;
        setTrackPosition(direction === 1 ? -viewerStage.clientWidth : viewerStage.clientWidth, true);

        clearTimeout(animationTimer);
        animationTimer = setTimeout(() => {
            currentIndex = index;
            prepareImages();
            updateInfo();
            resetTrack(false);
            isAnimating = false;
        }, ANIMATION_DURATION + 30);
    }

    viewerStage.addEventListener('pointerdown', event => {
        if (isAnimating || !viewer.classList.contains('active')) return;
        if (event.pointerType === 'mouse' && event.button !== 0) return;

        startX = event.clientX;
        startY = event.clientY;
        dragX = 0;
        dragging = true;
        horizontalDrag = false;
        activePointerId = event.pointerId;
        slideTrack.style.transition = 'none';

        try {
            viewerStage.setPointerCapture(event.pointerId);
        } catch (_) {}
    });

    viewerStage.addEventListener('pointermove', event => {
        if (!dragging || event.pointerId !== activePointerId) return;

        const dx = event.clientX - startX;
        const dy = event.clientY - startY;

        if (!horizontalDrag) {
            if (Math.abs(dx) < 5 && Math.abs(dy) < 5) return;
            if (Math.abs(dy) > Math.abs(dx) * 1.15) return;
            horizontalDrag = true;
        }

        dragX = dx;

        // Both neighboring panels are already loaded. Dragging left reveals
        // the next panel; dragging right reveals the previous panel.
        setTrackPosition(dx, false);
    });

    function endDrag(event) {
        if (!dragging || event.pointerId !== activePointerId) return;

        dragging = false;
        activePointerId = null;

        if (!horizontalDrag) {
            resetTrack(true);
            return;
        }

        const threshold = Math.max(45, viewerStage.clientWidth * SWIPE_THRESHOLD);

        if (dragX < -threshold) finishSlide(1);
        else if (dragX > threshold) finishSlide(-1);
        else resetTrack(true);
    }

    viewerStage.addEventListener('pointerup', endDrag);
    viewerStage.addEventListener('pointercancel', endDrag);

    function closeViewer() {
        if (!viewer.classList.contains('active')) return;

        clearTimeout(animationTimer);
        dragging = false;
        isAnimating = false;
        activePointerId = null;

        viewer.classList.remove('active');
        document.body.classList.remove('viewer-open');
        viewerImage.src = '';
        nextImage.src = '';
        resetTrack(false);

        if (previousFocus && typeof previousFocus.focus === 'function') {
            previousFocus.focus();
        }
    }

    closeBtn.addEventListener('click', closeViewer);

    document.addEventListener('keydown', event => {
        if (!viewer.classList.contains('active')) return;

        if (event.key === 'Escape') closeViewer();
        if (event.key === 'ArrowRight' && !isAnimating) finishSlide(1);
        if (event.key === 'ArrowLeft' && !isAnimating) finishSlide(-1);
    });

    buildCards();
    buildDots();
})();
</script>

</body>
</html>
